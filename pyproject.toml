[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensim-social"
version = "0.1.0"
description = "OpenSim: latent-state social simulation with future-constrained policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "peft==0.18.0",
  "accelerate==1.12.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "joblib==1.5.3",
  "PyYAML==6.0.3",
  "openai==2.13.0",
  "tqdm>=4.66,<5",
]

[project.scripts]
opensim = "opensim.pipeline:main"

[tool.setuptools.packages.find]
include = ["opensim*"]
